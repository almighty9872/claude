# Publishes the katolikdunyasi.com contact form Worker (cloudflare/contact-worker.js, config:
# cloudflare/wrangler.jsonc). Runs when something in cloudflare/ changes, and can also be started
# by hand from the Actions tab ("Run workflow").
#
# Repository secrets it needs (the same ones the English deploy uses): CLOUDFLARE_API_TOKEN, which
# must be allowed to edit Workers and the Workers routes of the katolikdunyasi.com zone, and
# CLOUDFLARE_ACCOUNT_ID. Setup: docs/owner-steps.md.
name: Deploy the contact form Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-contact.yml'
  workflow_dispatch:

# Actions are pinned to a commit and wrangler to an exact version, so a moved tag or a new
# release cannot change what runs here.
permissions:
  contents: read

concurrency:
  group: contact-worker
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the Worker script and its config
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: cloudflare

      - name: Check the script
        run: node --check cloudflare/contact-worker.js

      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.155.0 deploy --config cloudflare/wrangler.jsonc
