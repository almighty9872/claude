# Builds the English site (Verbum Domini, verbumdomini.ca) from its own folder, verbumdomini/, and
# publishes verbumdomini/_site_en/ to the Cloudflare Worker "verbumdomini"
# (config: verbumdomini/cloudflare/wrangler.jsonc). Runs when something in verbumdomini/ changes,
# and can also be started by hand from the Actions tab ("Run workflow").
#
# Repository secrets it needs: CLOUDFLARE_API_TOKEN (the "Edit Cloudflare Workers" token)
# and CLOUDFLARE_ACCOUNT_ID.
name: Deploy English site to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'verbumdomini/**'
      - '.github/workflows/deploy-english.yml'
  workflow_dispatch:

# The build and the publish run on separate machines: the Cloudflare token is only ever present in
# the publish job, which runs nothing but wrangler. Actions are pinned to a commit and npm packages
# to an exact version, so a moved tag or a new release cannot change what runs here.
permissions:
  contents: read

concurrency:
  group: english-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # full history: the sitemap's <lastmod> dates come from git
          persist-credentials: false

      - name: Install esbuild (the build minifies the CSS and JS with it)
        run: npm install -g esbuild@0.25.12

      - name: WebP and AVIF next to every painting (the pages offer them in <picture>)
        # A <picture> source that is missing does not fall back to the JPEG, so the step fails if
        # any copy was not made
        working-directory: verbumdomini/assets/art
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends webp libavif-bin >/dev/null
          find . -maxdepth 1 -name '*.jpg' -print0 | xargs -0 -P "$(nproc)" -I{} sh -c \
            'cwebp -quiet -mt -q 78 -metadata none "$1" -o "${1%.jpg}.webp" && avifenc -j 2 -q 55 -s 6 "$1" "${1%.jpg}.avif" >/dev/null' _ {}
          missing=0
          for f in ./*.jpg; do for x in webp avif; do [ -s "${f%.jpg}.$x" ] || { echo "missing ${f%.jpg}.$x"; missing=1; }; done; done
          exit $missing

      - name: Build the English site into verbumdomini/_site_en (PowerShell 7 is preinstalled on GitHub runners)
        shell: pwsh
        run: ./verbumdomini/tools/build.ps1 -EnglishSite

      - name: Check the built HTML (fails the deploy on broken markup)
        run: npx --yes html-validate@9.7.1 --config verbumdomini/.htmlvalidate.json "verbumdomini/_site_en/*.html"

      - name: Check internal links and anchors
        run: python3 verbumdomini/tools/qa/links.py verbumdomini/_site_en | tee links.txt && grep -q 'total bad 0' links.txt

      - name: Hand the built site to the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-en
          path: verbumdomini/_site_en
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the Worker scripts and their config
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: verbumdomini/cloudflare

      - name: Fetch the built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-en
          path: verbumdomini/_site_en

      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.155.0 deploy --config verbumdomini/cloudflare/wrangler.jsonc
          npx --yes wrangler@4.155.0 deploy --config verbumdomini/cloudflare/www.jsonc   # www.verbumdomini.ca redirect
