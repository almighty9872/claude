# Builds the static pages from data/ and content/ with tools/build.ps1 and publishes them to GitHub Pages.
# Runs on every push to "main" (e.g. after editing content/hakkinda.md or data/*.js on github.com),
# and can also be started by hand from the Actions tab ("Run workflow").
#
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'verbumdomini/**'               # the English site has its own folder and deploy
      - '.github/workflows/deploy-english.yml'
      - 'cloudflare/**'                 # the contact form Worker: deploy-contact.yml
      - '.github/workflows/deploy-contact.yml'
  workflow_dispatch:

# Each job asks for what it needs: the build runs npm packages, so it gets no deploy rights;
# only the deploy job can publish. Actions are pinned to a commit and npm packages to an exact
# version, so a moved tag or a new release cannot change what runs here.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0   # full history: the sitemap's <lastmod> dates come from git
          persist-credentials: false

      - name: Install esbuild (the build minifies the CSS and JS with it)
        run: npm install -g esbuild@0.25.12

      - name: WebP and AVIF next to every painting (the pages offer them in <picture>)
        # A <picture> source that is missing does not fall back to the JPEG, so the step fails if
        # any copy was not made
        working-directory: assets/art
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends webp libavif-bin >/dev/null
          find . -maxdepth 1 -name '*.jpg' -print0 | xargs -0 -P "$(nproc)" -I{} sh -c \
            'cwebp -quiet -mt -q 78 -metadata none "$1" -o "${1%.jpg}.webp" && avifenc -j 2 -q 55 -s 6 "$1" "${1%.jpg}.avif" >/dev/null' _ {}
          missing=0
          for f in ./*.jpg; do for x in webp avif; do [ -s "${f%.jpg}.$x" ] || { echo "missing ${f%.jpg}.$x"; missing=1; }; done; done
          exit $missing

      - name: Build pages (PowerShell 7 is preinstalled on GitHub runners)
        shell: pwsh
        run: ./tools/build.ps1   # site URL comes from the CNAME file

      - name: Check the built HTML (fails the deploy on broken markup)
        run: npx --yes html-validate@9.7.1 --config .htmlvalidate.json "./*.html" "kilise/*.html"

      - name: Check the internal links and anchors (fails the deploy on a broken one)
        run: python3 tools/qa/links.py | tee links.txt && grep -q 'total bad 0' links.txt

      - name: Collect the public files into _site
        # Only what the pages load: the minified CSS/JS (not their sources), the fonts and images,
        # and the few data files the scripts fetch at run time (the rest is built into the HTML).
        run: |
          mkdir -p _site/assets _site/data
          cp ./*.html sitemap.xml robots.txt llms.txt favicon.ico apple-touch-icon.png site.webmanifest _site/
          cp ./[0-9a-f]*.txt _site/                     # the IndexNow key file
          cp assets/*.min.js assets/*.min.css assets/*.jpg assets/*.png _site/assets/
          cp -r assets/fonts assets/art assets/og assets/vendor assets/sehir _site/assets/   # og: the churches' share cards; vendor: the Rosary's 3D beads (tools/rosary3d); sehir: Kilise Bul's city maps (tools/kilise-sehir-haritalari.py)
          cp data/compendium-*.js data/tespih.js data/azizler-adlar.js data/azizler-ozet-*.js data/refs-*.js _site/data/
          cp -r kilise _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi
          if [ -d .well-known ]; then cp -r .well-known _site/; fi
          touch _site/.nojekyll   # serve the files as they are, without Jekyll

      - name: Upload the site
        # v3 keeps .well-known/ and .nojekyll; v4 and later leave hidden files out
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # Tells Bing, Yandex, Seznam and the other IndexNow engines that every page may have
      # changed, so they come back sooner (Google reads sitemap.xml instead). The key file
      # (INDEXNOW_KEY.txt at the site root) is written by tools/build.ps1.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          INDEXNOW_KEY: 6d932ac291e035e4f4741e45a828f802
        run: |
          sleep 30
          urls=$(curl -fsS https://katolikdunyasi.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | jq -R . | jq -sc .)
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"katolikdunyasi.com\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://katolikdunyasi.com/$INDEXNOW_KEY.txt\",\"urlList\":$urls}" \
            -w 'IndexNow: HTTP %{http_code}\n'
